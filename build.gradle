buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://repo.spongepowered.org/maven/" }
    }
    dependencies {
        classpath group: "net.minecraftforge.gradle", name: "ForgeGradle", version: "5.1.+"
        classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT"
    }
}
apply plugin: "java"
apply plugin: "net.minecraftforge.gradle"
apply plugin: "org.spongepowered.mixin"

group = "com.astryxion.chaospersists"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
compileJava {
    sourceCompatibility = "8"
    targetCompatibility = "8"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://repo.spongepowered.org/maven/" }
    maven { url = "https://dvs1.progwml6.com/files/maven/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev/" }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2859"
    compileOnly("mezz.jei:jei_1.12.2:4.16.1.302:api") {
        transitive = false
    }
    embed("org.spongepowered:mixin:0.8.3-SNAPSHOT") {
        exclude module: "guava"
        exclude module: "commons-io"
        exclude module: "gson"
    }
}

mixin {
    config "chaospersists.mixin.json"
    disableAnnotationProcessorCheck()
}

minecraft {
    mappings channel: "stable", version: "39-1.12"
    runs {
        client {
            workingDirectory file("./run")
            arg "-tweakClass"
            arg "org.spongepowered.asm.launch.MixinTweaker"
            property "mixin.env.disableRefMap", "true"
            mods { ChaosPersists { source sourceSets.main } }
        }
        server {
            workingDirectory file("./run/server")
            arg "-tweakClass"
            arg "org.spongepowered.asm.launch.MixinTweaker"
            property "mixin.env.disableRefMap", "true"
            mods { ChaosPersists { source sourceSets.main } }
        }
    }
}

archivesBaseName = "ChaosPersists"

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"
    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": "1.12.2"
    }
    // Some 1.12 language loading paths still expect en_US-style names.
    // Keep both lowercase and legacy-cased locale files to ensure translations load.
    from("src/main/resources/assets/chaospersists/lang") {
        include "en_us.lang"
        include "en_us.json"
        rename { String fileName ->
            fileName.replace("en_us", "en_US")
        }
        into "assets/chaospersists/lang"
    }
}

// When Forge 1.12 loads mods from classpath, resources must be alongside classes
sourceSets.all { it.output.resourcesDir = it.output.classesDirs.getFiles().iterator().next() }
